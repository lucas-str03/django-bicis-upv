<div style="padding: 20px; max-width: 600px; margin: auto;">
  <h2 style="color: #3f51b5;">Formulario de Estaciones</h2>

  <form [formGroup]="estacionForm" style="display: flex; flex-direction: column; gap: 15px;">
    
    <mat-form-field appearance="outline">
      <mat-label>Número de Estación (ID)</mat-label>
      <input matInput formControlName="numero" type="number" placeholder="Ej: 1">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" placeholder="Ej: Estación UPV">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Geometría (WKT)</mat-label>
      <input matInput formControlName="geom" placeholder="Ej: POINT(-0.33 39.48)">
    </mat-form-field>

    <div style="display: flex; gap: 15px;">
      <mat-form-field appearance="outline" style="flex: 1;">
        <mat-label>Capacidad</mat-label>
        <input matInput formControlName="capacidad" type="number">
      </mat-form-field>

      <mat-form-field appearance="outline" style="flex: 1;">
        <mat-label>Bicis Disp.</mat-label>
        <input matInput formControlName="bicis_disponibles" type="number">
      </mat-form-field>

      <mat-form-field appearance="outline" style="flex: 1;">
        <mat-label>Bornes Libres</mat-label>
        <input matInput formControlName="bornes_libres" type="number">
      </mat-form-field>
    </div>

    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;">
      <button type="button" mat-raised-button color="primary" (click)="insert()">Insertar</button>
      <button type="button" mat-raised-button color="accent" (click)="selectOne()">Select One</button>
      
      <button type="button" mat-raised-button color="accent" (click)="selectAll()">Select All</button>

      <button type="button" mat-raised-button style="background-color: #ff9800; color: white;" (click)="update()">Actualizar</button>
      <button type="button" mat-raised-button color="warn" (click)="delete()">Borrar</button>
      <button type="button" mat-stroked-button (click)="clean()">Limpiar</button>
    </div>

  </form>

  <div *ngIf="mensaje" style="margin-top: 20px; padding: 10px; background: #e8eaf6; border-radius: 5px; color: #1a237e;">
    <strong>Estado:</strong> {{ mensaje }}
  </div>
</div>
