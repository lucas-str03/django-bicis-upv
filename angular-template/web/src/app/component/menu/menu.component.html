<nav style="display: flex; gap: 10px; padding: 10px; background: #f5f5f5; align-items: center;">
  
  <button mat-button routerLink="estaciones">Estaciones</button>
  <button mat-button routerLink="barrios">Barrios</button>
  <button mat-button routerLink="carriles">Carriles</button>

  <span style="flex: 1 1 auto;"></span> @if(authService.isAuthenticated) {
    <span style="margin-right: 10px; font-weight: bold; color: #3f51b5;">
      {{authService.username}}
    </span>
    <button mat-icon-button color="warn" routerLink="logout-form" title="Cerrar sesión">
      <mat-icon>logout</mat-icon>
    </button>
  } @else {
    <span>No has iniciado sesión</span>
    <button mat-icon-button color="primary" routerLink="login-form" title="Iniciar sesión">
      <mat-icon>login</mat-icon>
    </button>
  }
</nav>
