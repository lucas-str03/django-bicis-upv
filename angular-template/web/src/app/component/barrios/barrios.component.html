<div style="padding: 20px; max-width: 600px; margin: auto;">
  <h2 style="color: #4caf50;">Formulario de Barrios</h2>

  <form [formGroup]="barrioForm" style="display: flex; flex-direction: column; gap: 15px;">
    
    <div style="display: flex; gap: 15px;">
      <mat-form-field appearance="outline" style="flex: 1;">
        <mat-label>Código de Barrio (ID)</mat-label>
        <input matInput formControlName="codigo_barrio" placeholder="Ej: B01">
      </mat-form-field>

      <mat-form-field appearance="outline" style="flex: 2;">
        <mat-label>Nombre del Barrio</mat-label>
        <input matInput formControlName="nombre" placeholder="Ej: Benimaclet">
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Geometría (MULTIPOLYGON WKT)</mat-label>
      <textarea matInput formControlName="geom" rows="4" placeholder="Ej: MULTIPOLYGON(((...)))"></textarea>
    </mat-form-field>

    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;">
      <button type="button" mat-raised-button color="primary" (click)="insert()">Insertar</button>
      <button type="button" mat-raised-button color="accent" (click)="selectOne()">Select One</button>
      <button type="button" mat-raised-button color="accent" (click)="selectAll()">Select All</button>
      <button type="button" mat-raised-button style="background-color: #ff9800; color: white;" (click)="update()">Actualizar</button>
      <button type="button" mat-raised-button color="warn" (click)="delete()">Borrar</button>
      <button type="button" mat-stroked-button (click)="clean()">Limpiar</button>
    </div>

  </form>

  <div *ngIf="mensaje" style="margin-top: 20px; padding: 10px; background: #e8f5e9; border-radius: 5px; color: #1b5e20;">
    <strong>Estado:</strong> {{ mensaje }}
  </div>
</div>
